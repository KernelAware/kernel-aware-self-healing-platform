services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ../../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "7070:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"

  monitoring-agent:
    build: ../../monitoring-agent
    container_name: monitoring-agent

    ports:
      - "8001:8001"

    volumes:
      - ./data:/app/data

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    container_name: kernel-aware-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped