services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ../../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ../../grafana/grafana.ini:/etc/grafana/grafana.ini

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    volumes:
      - ../../loki/config/loki.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    container_name: kernel-aware-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
