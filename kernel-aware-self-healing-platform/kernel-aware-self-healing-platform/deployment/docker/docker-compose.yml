services:
  prometheus:
    image: prom/prometheus
    volumes:
      - /home/pasindu/kernel-aware-self-healing-platform/kernel-aware-self-healing-platform/kernel-aware-self-healing-platform/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"

  monitering-agent:
    build: ../../monitoring-agent
    container_name: monitering-agent

    ports:
      - "8001:8001"

    volumes:
      - ./data:/app/data

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    container_name: kernel-aware-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped